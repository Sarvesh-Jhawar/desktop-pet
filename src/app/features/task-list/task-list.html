<div class="task-panel glass-panel">
	<h2>Today's Tasks</h2>

	<div class="add-row">
		<input
			[(ngModel)]="newTitle"
			placeholder="New task..."
			(keyup.enter)="addTask()"
		/>
		<select [(ngModel)]="newPriority">
			<option value="low">Low</option>
			<option value="medium">Medium</option>
			<option value="high">High</option>
		</select>
		<button class="btn-primary" (click)="addTask()">+ Add</button>
	</div>

	<ul>
		@for (task of tasks(); track task.id) {
			<li [class.completed]="task.completed">
				<input
					type="checkbox"
					[checked]="task.completed"
					(change)="toggleComplete(task)"
				/>
				<span>{{ task.title }}</span>
				<span class="priority" [attr.data-priority]="task.priority">
					{{ task.priority }}
				</span>
				<button class="delete" (click)="deleteTask(task)" aria-label="Delete task">✕</button>
			</li>
		} @empty {
			<li class="empty">No tasks yet. Add one to get started.</li>
		}
	</ul>
</div>
