<div class="pet-container">

  @if (bubbleVisible()) {
    <div class="speech-bubble">
      {{ bubbleMessage() }}
    </div>
  }

  <canvas
    #petCanvas
    width="250"
    height="250"
  ></canvas>

  <div class="size-controls">

    <button
      (click)="setPetSize('small')"
    >
      S
    </button>

    <button
      (click)="setPetSize('medium')"
    >
      M
    </button>

    <button
      (click)="setPetSize('large')"
    >
      L
    </button>

  </div>

</div>
