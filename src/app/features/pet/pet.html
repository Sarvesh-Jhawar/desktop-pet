<div class="pet-container">

  <canvas
    #petCanvas
    width="250"
    height="250"
  ></canvas>

  <div
    style="
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 4px;
    "
  >
    <button (click)="setPetSize('small')">
      S
    </button>

    <button (click)="setPetSize('medium')">
      M
    </button>

    <button (click)="setPetSize('large')">
      L
    </button>
  </div>

</div>
