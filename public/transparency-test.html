<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Native Transparency Test</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent !important;
      }

      .marker {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 100px;
        height: 100px;
        border: 3px solid white;
        border-radius: 50%;
        background: #00c8ff;
        box-shadow: 0 0 0 2px #111, 0 4px 16px rgba(0, 0, 0, 0.3);
        transform: translate(-50%, -50%);
      }
    </style>
  </head>
  <body>
    <div class="marker" aria-label="Transparency test marker"></div>
  </body>
</html>
